name: Windows Gradle Build

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable (Windows not required, but safe)
        run: git update-index --chmod=+x gradlew

      - name: Run Gradle
        run: |
          .\gradlew.bat build
